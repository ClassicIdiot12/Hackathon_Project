<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HallPass — Tyee Community Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f3ec; --bg2: #ede7dc; --card: #ffffff;
      --navy: #1c2b4a; --coral: #e8523f; --green: #3a9e7a;
      --amber: #f0a218; --peri: #5b6ee8;
      --text: #1e1e1e; --muted: #6b6b6b;
      --border: rgba(0, 0, 0, 0.08);
      --sh-sm: 0 2px 8px rgba(0, 0, 0, 0.07);
      --sh-md: 0 4px 20px rgba(0, 0, 0, 0.10);
      --sh-lg: 0 8px 40px rgba(0, 0, 0, 0.15);
      --r: 12px; --r-sm: 8px;
      --display: 'Fraunces', serif;
      --body: 'Plus Jakarta Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      font-family: var(--body);
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 60%, rgba(212, 169, 106, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 85% 15%, rgba(91, 110, 232, 0.07) 0%, transparent 40%);
    }

    /* AUTH SCREEN */
    #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-box {
      background: var(--card); border-radius: 24px; padding: 48px 44px;
      width: 100%; max-width: 440px;
      box-shadow: var(--sh-lg); border: 1px solid var(--border);
      animation: popIn .4s cubic-bezier(.34, 1.56, .64, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.92) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .auth-logo {
      font-family: var(--display); font-size: 36px; font-weight: 900;
      color: var(--navy); text-align: center; margin-bottom: 6px;
    }
    .auth-logo span { color: var(--amber); }
    .auth-tagline { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 32px; }
    .auth-tabs { display: flex; background: var(--bg2); border-radius: var(--r); padding: 4px; margin-bottom: 28px; }
    .auth-tab {
      flex: 1; padding: 9px; border-radius: var(--r-sm); border: none;
      background: transparent; font-family: var(--body);
      font-size: 14px; font-weight: 600; color: var(--muted);
      cursor: pointer; transition: all .18s;
    }
    .auth-tab.active { background: var(--card); color: var(--navy); box-shadow: var(--sh-sm); }
    .auth-form-row { margin-bottom: 16px; }
    .auth-label {
      display: block; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .6px;
      color: var(--muted); margin-bottom: 7px;
    }
    .auth-input {
      width: 100%; padding: 12px 16px; border-radius: var(--r-sm);
      border: 2px solid var(--border); font-family: var(--body);
      font-size: 15px; background: var(--bg); color: var(--text);
      outline: none; transition: border-color .2s;
    }
    .auth-input:focus { border-color: var(--peri); background: var(--card); }
    .auth-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .auth-submit {
      width: 100%; padding: 14px; border-radius: var(--r); border: none;
      background: var(--navy); color: #fff;
      font-family: var(--body); font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all .2s; margin-top: 4px;
    }
    .auth-submit:hover { background: #2a3f6b; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(28, 43, 74, .3); }
    .auth-error {
      background: rgba(232, 82, 63, 0.09); border: 1px solid rgba(232, 82, 63, 0.25);
      border-radius: var(--r-sm); padding: 10px 14px;
      font-size: 13px; color: var(--coral); margin-bottom: 16px; display: none;
    }
    .auth-footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; line-height: 1.6; }

    /* MAIN APP */
    #main-app { display: none; }
    header {
      background: var(--navy); padding: 0 32px;
      display: flex; align-items: center; gap: 28px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.22);
    }
    .logo {
      font-family: var(--display); font-size: 26px; font-weight: 900;
      color: #fff; padding: 18px 0; letter-spacing: -0.5px;
      white-space: nowrap; user-select: none;
    }
    .logo span { color: var(--amber); }
    .nav-tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
    .nav-tab {
      padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
      color: rgba(255, 255, 255, 0.55); cursor: pointer; transition: all .2s;
      border: none; background: none; font-family: var(--body);
    }
    .nav-tab:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
    .nav-tab.active { color: var(--navy); background: #fff; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .user-pill {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 20px; padding: 6px 14px 6px 8px;
    }
    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--amber); color: var(--navy);
      font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--display);
    }
    .user-name { font-size: 13px; font-weight: 600; color: #fff; }
    .logout-btn {
      background: rgba(255, 255, 255, 0.12); border: none;
      color: rgba(255, 255, 255, 0.65);
      font-family: var(--body); font-size: 12px; font-weight: 600;
      padding: 5px 12px; border-radius: 16px; cursor: pointer; transition: all .15s;
    }
    .logout-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
    .post-btn {
      background: var(--amber); color: var(--navy); border: none;
      padding: 10px 22px; border-radius: 24px;
      font-family: var(--body); font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .post-btn:hover { background: #fbb62a; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(240, 162, 24, 0.45); }

    /* LAYOUT */
    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
    .stats-bar { display: flex; gap: 14px; margin-bottom: 32px; flex-wrap: wrap; }
    .stat-chip {
      background: var(--card); border-radius: var(--r);
      padding: 14px 22px; display: flex; align-items: center; gap: 10px;
      box-shadow: var(--sh-sm); border: 1px solid var(--border);
    }
    .stat-chip .num { font-family: var(--display); font-size: 30px; font-weight: 700; color: var(--navy); line-height: 1; }
    .stat-chip .lbl { font-size: 11px; color: var(--muted); font-weight: 500; line-height: 1.4; }
    .lf-layout { display: grid; grid-template-columns: 260px 1fr; gap: 24px; align-items: start; }
    .sidebar { display: flex; flex-direction: column; gap: 16px; }
    .scard { background: var(--card); border-radius: var(--r); padding: 20px; box-shadow: var(--sh-sm); border: 1px solid var(--border); }
    .scard-title { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 14px; }
    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-btn {
      padding: 8px 14px; border-radius: var(--r-sm); border: 1px solid var(--border);
      background: transparent; font-family: var(--body);
      font-size: 13px; font-weight: 500; color: var(--muted);
      cursor: pointer; text-align: left; transition: all .15s;
    }
    .filter-btn:hover { background: var(--bg2); color: var(--text); }
    .filter-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

    .my-stats { background: linear-gradient(135deg, var(--navy) 0%, #2d4470 100%); border-radius: var(--r); padding: 20px; color: #fff; }
    .my-stats-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255, 255, 255, 0.5); margin-bottom: 12px; }
    .my-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .my-stat { background: rgba(255, 255, 255, 0.08); border-radius: var(--r-sm); padding: 10px 12px; }
    .my-stat .n { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--amber); line-height: 1; }
    .my-stat .l { font-size: 11px; color: rgba(255, 255, 255, 0.6); margin-top: 3px; }

    .leader-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .leader-rank { font-size: 18px; width: 28px; text-align: center; }
    .leader-name { flex: 1; font-size: 13px; font-weight: 600; }
    .leader-pts { font-size: 12px; font-weight: 700; color: var(--amber); background: rgba(240, 162, 24, 0.12); padding: 3px 8px; border-radius: 20px; }

    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; }
    .item-card {
      background: var(--card); border-radius: var(--r); padding: 20px;
      box-shadow: var(--sh-sm); border: 1px solid var(--border);
      border-top: 4px solid var(--acc); cursor: pointer;
      transition: transform .28s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s;
      position: relative; transform: rotate(var(--tilt));
    }
    .item-card::before {
      content: '📌'; position: absolute; top: -15px; left: 50%;
      transform: translateX(-50%); font-size: 22px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18)); transition: transform .28s;
    }
    .item-card:hover { transform: rotate(0deg) translateY(-5px) scale(1.02); box-shadow: var(--sh-lg); z-index: 3; }
    .item-card.found { opacity: 0.65; }
    .status-badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; }
    .status-badge.open { background: rgba(232, 82, 63, 0.12); color: var(--coral); }
    .status-badge.found { background: rgba(58, 158, 122, 0.12); color: var(--green); }
    .card-title { font-family: var(--display); font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 5px; }

    /* HOMEWORK & HELP TAB */
    .hw-feed { display: flex; flex-direction: column; gap: 22px; }
    .hw-feed-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
    .hw-feed-header h2 { font-family: var(--display); font-size: 28px; font-weight: 900; color: var(--navy); letter-spacing: -0.5px; }
    .hw-feed-header .sub { font-size: 13px; color: var(--muted); }
    .hw-empty { background: var(--card); border-radius: var(--r); padding: 48px 24px; text-align: center; border: 2px dashed var(--border); color: var(--muted); }
    .hw-empty .em { font-size: 42px; margin-bottom: 12px; }
    .hw-empty h4 { font-family: var(--display); font-size: 18px; color: var(--navy); margin-bottom: 6px; font-weight: 700; }
    .hw-post { background: var(--card); border-radius: var(--r); box-shadow: var(--sh-sm); border: 1px solid var(--border); border-left: 4px solid var(--peri); overflow: hidden; transition: box-shadow .2s; }
    .hw-post:hover { box-shadow: var(--sh-md); }
    .hw-post-head { padding: 18px 22px 12px; display: flex; gap: 12px; align-items: flex-start; }
    .hw-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--peri), #8794f0); color: #fff; font-family: var(--display); font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .hw-avatar.teacher { background: linear-gradient(135deg, var(--amber), #f5bf57); color: var(--navy); }
    .hw-meta { flex: 1; min-width: 0; }
    .hw-author { font-size: 14px; font-weight: 700; color: var(--navy); }
    .hw-author .role-tag, .reply-author .role-tag { display: inline-block; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 10px; margin-left: 6px; vertical-align: 2px; }
    .role-tag.student { background: rgba(91, 110, 232, 0.15); color: var(--peri); }
    .role-tag.teacher { background: rgba(240, 162, 24, 0.18); color: #b87a0a; }
    .hw-time { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .hw-body { padding: 4px 22px 18px; }
    .hw-topic { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 8px; line-height: 1.25; }
    .hw-details { font-size: 14.5px; line-height: 1.55; color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .hw-actions { padding: 10px 22px; border-top: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; gap: 16px; }
    .reply-count { font-size: 13px; color: var(--muted); font-weight: 500; }
    .reply-count strong { color: var(--navy); font-weight: 700; }
    .reply-btn { margin-left: auto; background: var(--navy); color: #fff; border: none; padding: 8px 18px; border-radius: 20px; font-family: var(--body); font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .18s; }
    .reply-btn:hover { background: #2a3f6b; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(28, 43, 74, 0.28); }
    .reply-btn.alt { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 7px 14px; }
    .reply-btn.alt:hover { background: var(--bg2); color: var(--navy); transform: none; box-shadow: none; }
    .hw-replies { background: var(--bg); padding: 4px 22px 18px; display: none; border-top: 1px solid var(--border); }
    .hw-replies.open { display: block; animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .reply-item { display: flex; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .reply-item:last-child { border-bottom: none; }
    .reply-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--green), #5fc498); color: #fff; font-family: var(--display); font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .reply-avatar.teacher { background: linear-gradient(135deg, var(--amber), #f5bf57); color: var(--navy); }
    .reply-content { flex: 1; min-width: 0; }
    .reply-author { font-size: 13px; font-weight: 700; color: var(--navy); }
    .reply-time { font-size: 11px; color: var(--muted); margin-left: 4px; }
    .reply-text { font-size: 14px; line-height: 1.5; color: var(--text); margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
    .reply-form { display: flex; gap: 10px; align-items: flex-start; padding-top: 14px; border-top: 1px dashed var(--border); margin-top: 4px; }
    .reply-form textarea { flex: 1; min-height: 64px; padding: 10px 14px; border-radius: var(--r-sm); border: 2px solid var(--border); font-family: var(--body); font-size: 14px; background: var(--card); outline: none; resize: vertical; transition: border-color .15s; }
    .reply-form textarea:focus { border-color: var(--peri); }
    .reply-form button { background: var(--peri); color: #fff; border: none; padding: 10px 18px; border-radius: var(--r-sm); font-family: var(--body); font-weight: 700; font-size: 13px; cursor: pointer; align-self: stretch; transition: all .18s; }
    .reply-form button:hover { background: #4a5dd6; }

    /* MODAL */
    .overlay { position: fixed; inset: 0; background: rgba(28, 43, 74, 0.52); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
    .overlay.open { display: flex; }
    .modal { background: var(--bg); border-radius: 24px 24px 0 0; width: 100%; max-width: 680px; max-height: 88vh; overflow-y: auto; padding: 32px; box-shadow: 0 -8px 50px rgba(0, 0, 0, 0.22); animation: slideUp .32s cubic-bezier(.34, 1.56, .64, 1); }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .handle { width: 48px; height: 4px; background: var(--bg2); border-radius: 2px; margin: 0 auto 26px; }
    .modal h3 { font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
    .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .field-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 6px; margin-top: 6px; }

    /* ITEM DETAIL MODAL */
    .detail-hero { text-align: center; padding: 18px 0 22px; background: var(--bg2); border-radius: var(--r); margin-bottom: 18px; position: relative; }
    .detail-emoji { font-size: 72px; line-height: 1; margin-bottom: 8px; display: inline-block; }
    .detail-hero .status-badge { position: absolute; top: 12px; right: 12px; }
    .detail-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm); margin-bottom: 8px; font-size: 14px; color: var(--text); }
    .detail-row .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); min-width: 76px; }
    .sbtn.ghost { background: transparent; color: var(--navy); border: 2px solid var(--border); margin-top: 6px; }
    .sbtn.ghost:hover { background: var(--bg2); border-color: var(--navy); }
    .sbtn.coral { background: var(--coral); }
    .sbtn.coral:hover { background: #d3422f; }
    .sbtn.green { background: var(--green); }
    .sbtn.green:hover { background: #2f8767; }

    /* BREATHING */
    .breathe-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px 32px; gap: 24px; }
    .breathe-circle { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #8794f0, var(--peri) 70%); box-shadow: 0 12px 50px rgba(91, 110, 232, 0.45); transform: scale(0.5); transition: transform 4s ease-in-out; }
    .breathe-circle.expand { transform: scale(1.15); }
    .breathe-label { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--navy); letter-spacing: 0.5px; min-height: 36px; }
    .breathe-cycle-count { font-size: 13px; color: var(--muted); letter-spacing: 0.6px; text-transform: uppercase; font-weight: 600; }

    /* GARDEN */
    .garden-stage { position: relative; width: 100%; height: 360px; border-radius: var(--r); background: linear-gradient(180deg, #c5e8f5 0%, #cfe9b8 55%, #97c976 100%); overflow: hidden; cursor: crosshair; margin-bottom: 14px; box-shadow: inset 0 -8px 30px rgba(0, 0, 0, 0.08); }
    .garden-stage::before { content: '☀️'; position: absolute; top: 14px; right: 18px; font-size: 32px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.15)); }
    .garden-flower { position: absolute; transform: translate(-50%, -50%) scale(0); animation: bloom .55s cubic-bezier(.34, 1.56, .64, 1) forwards; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18)); user-select: none; }
    @keyframes bloom { 0% { transform: translate(-50%, -50%) scale(0) rotate(-30deg); } 60% { transform: translate(-50%, -50%) scale(1.2) rotate(8deg); } 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); } }
    .garden-info { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
    .garden-info .count { background: var(--bg2); padding: 5px 12px; border-radius: 20px; font-weight: 700; color: var(--navy); }

    /* CHILL CARDS */
    .chill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .chill-card { background: var(--card); border-radius: 20px; padding: 32px 26px; border: 1px solid var(--border); cursor: pointer; transition: transform .2s; position: relative; overflow: hidden; }
    .chill-card:hover { transform: translateY(-5px); box-shadow: var(--sh-md); }
    .chill-card h3 { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
    .chill-card p { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .chill-card .chill-cta { display: inline-block; margin-top: 14px; font-size: 12px; font-weight: 700; color: var(--peri); letter-spacing: 0.5px; text-transform: uppercase; }
    .chill-section-title { font-family: var(--display); font-size: 20px; font-weight: 800; color: var(--navy); margin: 28px 0 14px; }
    .chill-section-title:first-child { margin-top: 0; }

    /* FORMS */
    .finput, .ftextarea, .fselect { width: 100%; padding: 10px 14px; border-radius: var(--r-sm); border: 2px solid var(--border); font-family: var(--body); font-size: 14px; background: var(--card); outline: none; margin-bottom: 10px; transition: border-color .15s; }
    .finput:focus, .ftextarea:focus { border-color: var(--peri); }
    .ftextarea { min-height: 120px; resize: vertical; line-height: 1.5; }
    .sbtn { width: 100%; padding: 14px; border-radius: var(--r); border: none; background: var(--navy); color: #fff; font-weight: 700; cursor: pointer; font-family: var(--body); font-size: 15px; transition: all .18s; margin-top: 8px; }
    .sbtn:hover { background: #2a3f6b; transform: translateY(-1px); }

    /* ════════════════════════════════════════════
       MINIGAMES (Logic Grid, Word Ladder, Anagram Sprint)
    ════════════════════════════════════════════ */
    .game-back {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 7px 16px; border-radius: 20px;
      font-family: var(--body); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .15s; margin-bottom: 18px;
    }

    .game-header { text-align: center; margin-bottom: 20px; }
    .game-header h2 { font-family: var(--display); font-size: 30px; font-weight: 900; color: var(--navy); margin-bottom: 6px; }
    .game-header p { font-size: 13px; color: var(--muted); }
    .game-toolbar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
    .game-pill { padding: 9px 18px; border-radius: 22px; border: 2px solid var(--border); background: var(--card); font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .15s; }
    .game-pill:hover { background: var(--bg2); }
    .game-pill.active { border-color: var(--peri); background: var(--peri); color: #fff; }
    .game-new-btn { padding: 9px 22px; border-radius: 22px; border: none; background: var(--amber); color: var(--navy); font-family: var(--body); font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s; }
    .game-new-btn:hover { background: #fbb62a; transform: translateY(-1px); }
    .game-card { background: var(--card); border-radius: 20px; padding: 28px; box-shadow: var(--sh-md); border: 1px solid var(--border); margin-bottom: 16px; }
    .game-stats { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 12px; }
    .game-stats strong { color: var(--navy); }
    .game-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .game-btn { padding: 11px 20px; border-radius: 12px; border: 2px solid var(--border); background: var(--card); color: var(--navy); font-family: var(--body); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .game-btn:hover { background: var(--bg2); }
    .game-btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
    .game-btn.primary:hover { background: #2a3f6b; }
    .game-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* Victory overlay (used by all 3 games) */
    .game-victory { position: fixed; inset: 0; background: rgba(28, 43, 74, 0.7); backdrop-filter: blur(4px); z-index: 300; display: none; align-items: center; justify-content: center; }
    .game-victory.show { display: flex; }
    .game-victory-card { background: var(--card); border-radius: 20px; padding: 40px; text-align: center; max-width: 420px; margin: 16px; animation: pop .4s cubic-bezier(.34, 1.56, .64, 1); }
    @keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
    .game-victory-card h2 { font-family: var(--display); font-size: 32px; color: var(--green); margin-bottom: 8px; }
    .game-victory-card p { color: var(--muted); margin-bottom: 16px; }
    .game-victory-card button { background: var(--navy); color: #fff; border: none; padding: 12px 28px; border-radius: 24px; font-family: var(--body); font-size: 14px; font-weight: 700; cursor: pointer; }
    .game-victory-card button:hover { background: #2a3f6b; }

    /* LOGIC GRID specific */
    .lg-clues { background: var(--bg2); border-radius: 14px; padding: 18px; margin-bottom: 22px; }
    .lg-clues-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 10px; }
    .lg-clue-list { list-style: none; counter-reset: clue; }
    .lg-clue-list li { padding: 6px 0 6px 28px; position: relative; font-size: 14px; line-height: 1.55; counter-increment: clue; }
    .lg-clue-list li::before { content: counter(clue); position: absolute; left: 0; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--peri); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .lg-grid-wrap { display: flex; justify-content: center; overflow-x: auto; }
    table.lg-grid { border-collapse: collapse; }
    table.lg-grid th, table.lg-grid td { border: 1px solid var(--border); width: 50px; height: 50px; text-align: center; vertical-align: middle; }
    table.lg-grid th { background: var(--bg2); font-size: 11px; font-weight: 700; color: var(--navy); padding: 6px; writing-mode: vertical-rl; transform: rotate(180deg); max-width: 50px; }
    table.lg-grid th.lg-row-header { writing-mode: horizontal-tb; transform: none; text-align: right; padding-right: 12px; padding-left: 8px; width: auto; max-width: none; min-width: 90px; }
    table.lg-grid th.lg-corner { background: transparent; border: none; }
    table.lg-grid td { cursor: pointer; transition: background .15s; font-size: 18px; user-select: none; }
    table.lg-grid td:hover { background: var(--bg2); }
    table.lg-grid td.yes { background: rgba(58, 158, 122, 0.18); color: var(--green); font-weight: 700; }
    table.lg-grid td.no { background: rgba(232, 82, 63, 0.10); color: var(--coral); }
    .lg-divider { border-right: 3px solid var(--navy) !important; }
    .lg-hint-box { background: rgba(91, 110, 232, 0.08); border-left: 3px solid var(--peri); padding: 12px 16px; border-radius: 8px; font-size: 13px; color: var(--navy); margin-top: 14px; display: none; }
    .lg-hint-box.show { display: block; animation: slideDown .3s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .lg-legend { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; line-height: 1.6; }
    .lg-legend kbd { background: var(--bg2); border-radius: 4px; padding: 1px 8px; font-family: monospace; border: 1px solid var(--border); }

    /* WORD LADDER specific */
    .wl-goal { text-align: center; margin-bottom: 22px; font-size: 14px; color: var(--muted); }
    .wl-goal strong { color: var(--navy); }
    .wl-ladder { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 18px; }
    .wl-rung { display: flex; gap: 6px; padding: 10px 16px; border-radius: 12px; transition: all .25s; animation: rungIn .3s cubic-bezier(.34, 1.56, .64, 1); }
    @keyframes rungIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .wl-rung.start { background: rgba(91, 110, 232, 0.10); border: 2px dashed var(--peri); }
    .wl-rung.target { background: rgba(58, 158, 122, 0.10); border: 2px dashed var(--green); }
    .wl-rung.history { background: var(--bg2); }
    .wl-rung.preview { background: rgba(240, 162, 24, 0.08); border: 2px solid var(--amber); }
    .wl-rung.preview.invalid { background: rgba(232, 82, 63, 0.08); border-color: var(--coral); }
    .wl-letter { width: 44px; height: 52px; border-radius: 8px; background: var(--card); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 800; font-size: 22px; color: var(--navy); text-transform: uppercase; transition: all .2s; }
    .wl-letter.changed { background: var(--amber); color: var(--navy); border-color: var(--amber); }
    .wl-letter input { width: 100%; height: 100%; border: none; background: transparent; font-family: var(--mono); font-weight: 800; font-size: 22px; color: var(--navy); text-align: center; text-transform: uppercase; outline: none; padding: 0; }
    .wl-arrow { color: var(--muted); font-size: 20px; margin: -2px 0; opacity: .5; }
    .wl-feedback { text-align: center; margin: 14px 0 0; min-height: 22px; font-size: 14px; font-weight: 600; transition: color .2s; }
    .wl-feedback.error { color: var(--coral); }
    .wl-feedback.success { color: var(--green); }
    .wl-stats-row { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
    .wl-stats-row strong { color: var(--navy); }
    .wl-info { font-size: 12px; color: var(--muted); text-align: center; margin-top: 12px; line-height: 1.6; }
    .wl-word-path { font-family: var(--mono); font-weight: 800; color: var(--peri); font-size: 14px; margin: 16px 0; letter-spacing: 2px; }

    /* ANAGRAM SPRINT specific */
    .as-start-row { text-align: center; }
    .as-diff-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 20px 0 24px; }
    .as-diff-card { flex: 1; min-width: 140px; max-width: 200px; padding: 18px 14px; border-radius: 14px; border: 2px solid var(--border); background: var(--bg2); cursor: pointer; transition: all .2s; }
    .as-diff-card:hover { transform: translateY(-2px); }
    .as-diff-card.active { border-color: var(--peri); background: var(--card); }
    .as-diff-card .name { font-family: var(--display); font-size: 16px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
    .as-diff-card .desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .as-start-btn { padding: 14px 36px; border-radius: 26px; border: none; background: var(--navy); color: #fff; font-family: var(--body); font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s; }
    .as-start-btn:hover { background: #2a3f6b; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(28, 43, 74, .3); }
    .as-hi-score { margin-top: 18px; font-size: 13px; color: var(--muted); }
    .as-hi-score strong { color: var(--amber); }
    .as-hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 14px; }
    .as-hud-stat { text-align: center; }
    .as-hud-stat .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 2px; }
    .as-hud-stat .val { font-family: var(--display); font-size: 26px; font-weight: 800; color: var(--navy); line-height: 1; }
    .as-hud-stat.timer .val { color: var(--peri); }
    .as-hud-stat.timer.warn .val { color: var(--coral); animation: pulse .5s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }
    .as-letters { display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
    .as-letter-tile { width: 56px; height: 64px; border-radius: 12px; background: linear-gradient(180deg, #ffffff 0%, #f0ebe0 100%); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 800; font-size: 28px; color: var(--navy); text-transform: uppercase; box-shadow: 0 3px 6px rgba(0,0,0,0.08); cursor: pointer; user-select: none; transition: transform .15s, box-shadow .15s; }
    .as-letter-tile:hover { transform: translateY(-2px); box-shadow: 0 5px 12px rgba(0,0,0,0.12); }
    .as-letter-tile.used { opacity: 0.3; pointer-events: none; transform: scale(.92); }
    .as-input-area { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .as-word-input { flex: 1; max-width: 320px; padding: 14px 18px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg2); font-family: var(--mono); font-weight: 700; font-size: 22px; color: var(--navy); text-align: center; text-transform: uppercase; outline: none; letter-spacing: 3px; transition: border-color .2s; }
    .as-word-input:focus { border-color: var(--peri); background: var(--card); }
    .as-submit-btn { padding: 14px 24px; border-radius: 12px; border: none; background: var(--peri); color: #fff; font-family: var(--body); font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s; }
    .as-submit-btn:hover { background: #4a5dd0; }
    .as-shuffle-btn { padding: 8px 16px; border-radius: 20px; border: 2px solid var(--border); background: var(--card); color: var(--muted); font-family: var(--body); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; display: block; margin: 0 auto 14px; }
    .as-shuffle-btn:hover { background: var(--bg2); color: var(--text); }
    .as-feedback { text-align: center; min-height: 22px; font-size: 14px; font-weight: 600; margin-bottom: 12px; transition: color .2s; }
    .as-feedback.error { color: var(--coral); animation: shake .4s; }
    .as-feedback.success { color: var(--green); animation: bounceIn .4s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
    @keyframes bounceIn { 0% { transform: translateY(0); } 30% { transform: translateY(-6px); } 100% { transform: translateY(0); } }
    .as-found-words { margin-top: 16px; padding: 14px; background: var(--bg2); border-radius: 12px; max-height: 200px; overflow-y: auto; }
    .as-found-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
    .as-found-empty { color: var(--muted); font-size: 13px; font-style: italic; text-align: center; padding: 8px; }
    .as-found-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .as-found-pill { padding: 4px 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--navy); animation: foundIn .35s cubic-bezier(.34,1.56,.64,1); }
    .as-found-pill.bonus { background: var(--amber); color: var(--navy); border-color: var(--amber); box-shadow: 0 2px 8px rgba(240,162,24,0.4); }
    @keyframes foundIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    .as-end-screen { text-align: center; padding: 16px 0; }
    .as-end-screen h2 { font-family: var(--display); font-size: 30px; font-weight: 900; color: var(--navy); margin-bottom: 8px; }
    .as-final-score { font-family: var(--display); font-size: 52px; font-weight: 900; color: var(--peri); line-height: 1; margin: 14px 0 4px; }
    .as-final-label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 18px; }
    .as-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0; }
    .as-stat-cell { background: var(--bg2); border-radius: 12px; padding: 14px 8px; }
    .as-stat-cell .n { font-family: var(--display); font-size: 22px; font-weight: 800; color: var(--navy); line-height: 1; }
    .as-stat-cell .l { font-size: 10px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }
    .as-missed-section { margin-top: 18px; text-align: left; background: var(--bg2); border-radius: 12px; padding: 16px; }
    .as-missed-section .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
    .as-missed-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .as-missed-list .miss { padding: 3px 9px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); }
    .as-new-high { color: var(--amber); font-weight: 700; }

    @media (max-width: 780px) {
      .lf-layout { grid-template-columns: 1fr; }
      .nav-tab { padding: 8px 12px; font-size: 13px; }
      table.lg-grid th, table.lg-grid td { width: 40px; height: 40px; }
      table.lg-grid th.lg-row-header { min-width: 70px; font-size: 10px; }
      .wl-letter { width: 38px; height: 46px; font-size: 18px; }
      .wl-letter input { font-size: 18px; }
      .as-letter-tile { width: 46px; height: 54px; font-size: 22px; }
    }
  </style>
</head>

<body>
  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">📌 Hall<span>Pass</span></div>
      <div class="auth-tagline">Tyee Middle School Community Board</div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="authTab('login')">Log In</button>
        <button class="auth-tab" id="tab-signup" onclick="authTab('signup')">Create Account</button>
      </div>
      <div id="auth-error" class="auth-error"></div>
      <div id="form-login">
        <div class="auth-form-row"><label class="auth-label">Username</label><input class="auth-input" id="li-user" type="text" placeholder="e.g. jayden_k"></div>
        <div class="auth-form-row"><label class="auth-label">Password</label><input class="auth-input" id="li-pass" type="password" placeholder="••••••••"></div>
        <button class="auth-submit" onclick="doLogin()">Log In →</button>
      </div>
      <div id="form-signup" style="display:none">
        <div class="auth-2col">
          <div class="auth-form-row"><label class="auth-label">First Name</label><input class="auth-input" id="su-first" type="text" placeholder="Jayden"></div>
          <div class="auth-form-row"><label class="auth-label">Last Initial</label><input class="auth-input" id="su-last" type="text" placeholder="K" maxlength="1"></div>
        </div>
        <div class="auth-form-row"><label class="auth-label">Username</label><input class="auth-input" id="su-user" type="text" placeholder="jayden_k"></div>
        <div class="auth-form-row"><label class="auth-label">Password</label><input class="auth-input" id="su-pass" type="password" placeholder="Choose password"></div>
        <div class="auth-form-row"><label class="auth-label">Role</label>
          <select class="auth-input" id="su-role"><option value="student">Student</option><option value="teacher">Teacher / Staff</option></select>
        </div>
        <button class="auth-submit" onclick="doSignup()">Create Account →</button>
      </div>
    </div>
  </div>

  <div id="main-app">
    <header>
      <div class="logo">📌 Hall<span>Pass</span></div>
      <nav class="nav-tabs">
        <button class="nav-tab active" id="btn-lost" onclick="switchTab('lost')">🔍 Lost & Found</button>
        <button class="nav-tab" id="btn-sub" onclick="switchTab('sub')">📋 Sub Board</button>
        <button class="nav-tab" id="btn-homework" onclick="switchTab('homework')">📚 Homework & Help</button>
        <button class="nav-tab" id="btn-chill" onclick="switchTab('chill')">🧘 Chill Zone</button>
      </nav>
      <div class="header-right">
        <div class="user-pill">
          <div class="user-avatar" id="hdr-avatar">?</div>
          <span class="user-name" id="hdr-name">User</span>
        </div>
        <button class="logout-btn" onclick="doLogout()">Log Out</button>
        <button class="post-btn" id="post-btn" onclick="openPostModal()">+ Post Item</button>
      </div>
    </header>
    <main class="container"><div id="app"></div></main>
  </div>

  <div id="overlay" class="overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()"><div id="modal-body"></div></div>
  </div>

  <!-- Game victory overlay (separate so it can show over the chill zone view) -->
  <div id="game-victory" class="game-victory" onclick="hideGameVictory()">
    <div class="game-victory-card" onclick="event.stopPropagation()">
      <h2 id="gv-title">🎉 Solved!</h2>
      <p id="gv-msg"></p>
      <div id="gv-extra"></div>
      <button onclick="hideGameVictory()">Continue</button>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════
    // 1. ACCOUNT MANAGER
    // ═══════════════════════════════════════════════
    class AccountManager {
      constructor() {
        this.storageKey = 'hallpass_accounts_v1';
        this.accounts = this.loadFromDisk();
        if (Object.keys(this.accounts).length === 0) this.seedInitialUsers();
      }
      seedInitialUsers() {
        const defaults = [
          { username: 'jayden_k', password: 'pass123', first: 'Jayden', last: 'K', role: 'student', points: 50 },
          { username: 'ms_peterson', password: 'teach1', first: 'Ms.', last: 'Peterson', role: 'teacher', points: 0 }
        ];
        defaults.forEach(u => this.addAccount(u.username, u));
      }
      addAccount(username, data) {
        this.accounts[username.toLowerCase()] = { username: username.toLowerCase(), ...data, createdAt: new Date().toISOString() };
        this.saveToDisk();
      }
      getAccount(username, password) {
        const user = this.accounts[username.toLowerCase()];
        return (user && user.password === password) ? user : null;
      }
      saveToDisk() { localStorage.setItem(this.storageKey, JSON.stringify(this.accounts)); }
      loadFromDisk() { const data = localStorage.getItem(this.storageKey); return data ? JSON.parse(data) : {}; }
    }

    // ═══════════════════════════════════════════════
    // 2. APP STATE
    // ═══════════════════════════════════════════════
    const manager = new AccountManager();
    let currentUser = null;
    let currentTab = 'lost', filter = 'all', uid = 500;
    let openReplyBox = null;
    let currentChillView = 'menu';  // 'menu' | 'breathing' | 'garden' | 'logic' | 'ladder' | 'anagram'

    // ═══════════════════════════════════════════════
    // 3. AUTH LOGIC
    // ═══════════════════════════════════════════════
    function authTab(t) {
      document.getElementById('tab-login').classList.toggle('active', t === 'login');
      document.getElementById('tab-signup').classList.toggle('active', t === 'signup');
      document.getElementById('form-login').style.display = (t === 'login') ? 'block' : 'none';
      document.getElementById('form-signup').style.display = (t === 'signup') ? 'block' : 'none';
      hideErr();
    }
    function showErr(m) { const e = document.getElementById('auth-error'); e.textContent = m; e.style.display = 'block'; }
    function hideErr() { document.getElementById('auth-error').style.display = 'none'; }

    function doLogin() {
      const u = document.getElementById('li-user').value.trim();
      const p = document.getElementById('li-pass').value;
      const user = manager.getAccount(u, p);
      if (!user) { showErr('Incorrect username or password!'); return; }
      loginAs(user);
    }
    function doSignup() {
      const first = document.getElementById('su-first').value.trim();
      const last = document.getElementById('su-last').value.trim();
      const u = document.getElementById('su-user').value.trim();
      const p = document.getElementById('su-pass').value;
      const role = document.getElementById('su-role').value;
      if (!first || !u || !p) { showErr('Please fill in required fields!'); return; }
      if (manager.accounts[u.toLowerCase()]) { showErr('Username already exists!'); return; }
      const newUser = { password: p, first, last, role, points: 0 };
      manager.addAccount(u, newUser);
      loginAs(manager.accounts[u.toLowerCase()]);
    }
    function loginAs(user) {
      currentUser = user;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('hdr-avatar').textContent = user.first[0];

      const circle = document.getElementById('breathe-circle');

      if (!circle || !label) return;
      const phases = [
        { text: 'Breathe in…', dur: 4000, expand: true },
        { text: 'Hold',        dur: 2000, expand: true },
        { text: 'Breathe out…',dur: 4000, expand: false },
        { text: 'Rest',        dur: 1000, expand: false }
      ];
      let phaseIdx = 0, cycles = 0;
      function nextPhase() {
        if (currentChillView !== 'breathing') return;
        const p = phases[phaseIdx];
        const c2 = document.getElementById('breathe-circle');
        const l2 = document.getElementById('breathe-label');
        const cy = document.getElementById('breathe-cycles');
        if (!c2 || !l2) return;
        l2.textContent = p.text;

        if (phaseIdx === 0) { cycles++; if (cy) cy.textContent = `Cycle ${cycles}`; }

        breathingTimer = setTimeout(nextPhase, p.dur);
      }
      breathingTimer = setTimeout(nextPhase, 300);
    }

      return `

    function plantFlower(event) {
      const stage = document.getElementById('garden-stage');
      if (!stage) return;
      const rect = stage.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - rect.top) / rect.height) * 100;
      const clampedY = Math.max(35, Math.min(95, y));
      const emojis = ['🌸', '🌺', '🌷', '🌻', '🌹', '🌼', '🪷', '💐'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      const size = 24 + Math.floor(Math.random() * 18);
      const flower = { x, y: clampedY, emoji, size };
      gardenFlowers.push(flower);
      const span = document.createElement('span');
      span.className = 'garden-flower';
      span.style.left = `${x}%`; span.style.top = `${clampedY}%`; span.style.fontSize = `${size}px`;
      span.textContent = emoji;
      stage.appendChild(span);
      const counter = document.getElementById('garden-count');
      if (counter) counter.textContent = `${gardenFlowers.length} planted`;
    }
    function resetGarden() { gardenFlowers = []; render(); }

    function escapeHTML(str) {
      if (str == null) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function formatTime(ts) {
      const diff = Date.now() - ts;
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.floor(hrs / 24);
      if (days < 7) return days + 'd ago';
      return new Date(ts).toLocaleDateString();
    }

    let lgDifficulty = 'easy', lgTemplate = null, lgSolution = null, lgClues = null, lgGridState = {};
    let lgStats = JSON.parse(localStorage.getItem('logicgrid_stats') || '{"solved":0,"hints":0}');

    const lgShuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=~~(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
    const lgPick    = arr => arr[~~(Math.random()*arr.length)];

    function lgGenerateSolution(template) {
      const N = template.categories[0].values.length;
      const sol = [];
      const shuffled = template.categories.map(c => lgShuffle(c.values));
      for (let i = 0; i < N; i++) {
        const row = {};
        template.categories.forEach((c, ci) => row[c.name] = shuffled[ci][i]);
        sol.push(row);
      }
      return sol;
    }

    function lgGenerateClues(solution, categories) {
      const catNames = categories.map(c => c.name);
      const N = solution.length;
      const allPositive = [], allNegative = [];
      for (let i = 0; i < N; i++) {
        for (let a = 0; a < catNames.length; a++) {
          for (let b = a+1; b < catNames.length; b++) {
            allPositive.push({ type:'pos', a:catNames[a], aV:solution[i][catNames[a]], b:catNames[b], bV:solution[i][catNames[b]] });
          }
        }
      }
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          if (i === j) continue;
          for (let a = 0; a < catNames.length; a++) {
            for (let b = a+1; b < catNames.length; b++) {
              allNegative.push({ type:'neg', a:catNames[a], aV:solution[i][catNames[a]], b:catNames[b], bV:solution[j][catNames[b]] });
            }
          }
        }
      }
      for (let attempt = 0; attempt < 50; attempt++) {
        const pool = [];
        const numPos = N === 3 ? 2 : N === 4 ? 3 : 4;
        const numNeg = N === 3 ? 2 : N === 4 ? 4 : 6;
        const sP = lgShuffle(allPositive), sN = lgShuffle(allNegative);
        for (let i = 0; i < numPos && i < sP.length; i++) pool.push(sP[i]);
        for (let i = 0; i < numNeg && i < sN.length; i++) pool.push(sN[i]);
        if (lgVerifyUniqueness(pool, categories)) {
          return pool.map(c => ({ raw: c, text: c.type === 'pos'
            ? `The ${c.a.toLowerCase()} **${c.aV}** is matched with **${c.bV}**.`
            : `The ${c.a.toLowerCase()} **${c.aV}** is NOT matched with **${c.bV}**.` }));
        }
      }
      return allPositive.slice(0, 4).map(c => ({ raw: c, text: `The ${c.a.toLowerCase()} **${c.aV}** is matched with **${c.bV}**.` }));
    }

    function lgVerifyUniqueness(clues, categories) {
      const N = categories[0].values.length;
      function permute(arr) {
        if (arr.length <= 1) return [arr];
        const result = [];
        for (let i = 0; i < arr.length; i++) {
          const rest = [...arr.slice(0, i), ...arr.slice(i+1)];
          for (const p of permute(rest)) result.push([arr[i], ...p]);
        }
        return result;
      }
      const anchor = categories[0].values;
      const otherCats = categories.slice(1);
      const otherPerms = otherCats.map(c => permute(c.values));
      function* productGen(arrays, prefix=[]) {
        if (arrays.length === 0) { yield prefix; return; }
        const [first, ...rest] = arrays;
        for (const item of first) yield* productGen(rest, [...prefix, item]);
      }
      let validCount = 0;
      for (const combo of productGen(otherPerms)) {
        const cand = anchor.map((a, i) => {
          const row = { [categories[0].name]: a };
          otherCats.forEach((c, ci) => row[c.name] = combo[ci][i]);
          return row;
        });
        if (lgSatisfiesClues(cand, clues)) {
          validCount++;
          if (validCount > 1) return false;
        }
      }
      return validCount === 1;
    }
    function lgSatisfiesClues(solution, clues) {
      for (const c of clues) {
        const r = c.raw || c;
        if (r.type === 'pos') {
          const row = solution.find(row => row[r.a] === r.aV);
          if (!row || row[r.b] !== r.bV) return false;
        } else {
          const row = solution.find(row => row[r.a] === r.aV);
          if (!row) return false;
          if (row[r.b] === r.bV) return false;
        }
      }
      return true;
    }

    const WL_SETS = {};
    Object.keys(WL_WORDS).forEach(k => WL_SETS[k] = new Set(WL_WORDS[k]));

    function wlNeighbors(word, wordSet) {
      const n = [];
      for (let i = 0; i < word.length; i++) {
        for (let c = 65; c <= 90; c++) {
          const letter = String.fromCharCode(c);
          if (letter === word[i]) continue;
          const cand = word.slice(0, i) + letter + word.slice(i+1);
          if (wordSet.has(cand)) n.push(cand);
        }
      }
      return n;
    }
    function wlBFS(start, end, wordSet) {
      if (start === end) return [start];
      const visited = new Set([start]);
      const queue = [[start]];
      while (queue.length) {
        const path = queue.shift();
        const node = path[path.length - 1];
        for (const neigh of wlNeighbors(node, wordSet)) {
          if (visited.has(neigh)) continue;
          if (neigh === end) return [...path, neigh];
          visited.add(neigh);
          queue.push([...path, neigh]);
        }
      }
      return null;
    }
    function wlGenerate(len) {
      const list = WL_WORDS[len], wordSet = WL_SETS[len];
      for (let attempt = 0; attempt < 100; attempt++) {
        const start = list[~~(Math.random() * list.length)];
        const end = list[~~(Math.random() * list.length)];
        if (start === end) continue;
        const path = wlBFS(start, end, wordSet);
        if (path && path.length >= 4 && path.length <= 8) return { start, end, optimal: path.length - 1 };
      }
      if (len === 3) return { start: 'CAT', end: 'DOG', optimal: 3 };
      if (len === 4) return { start: 'COLD', end: 'WARM', optimal: 4 };
      return { start: 'HEART', end: 'BEACH', optimal: 5 };
    }

    function wlRenderLadder() {
      const ladder = document.getElementById('wl-ladder');

        ladder.appendChild(wlArrowEl());

      }
      const lastWord = wlHistory[wlHistory.length - 1];
      if (lastWord !== wlPuzzle.end) {
        ladder.appendChild(wlArrowEl());
        ladder.appendChild(wlPreviewRowEl(lastWord));
        ladder.appendChild(wlArrowEl());
      }
      ladder.appendChild(wlRungEl(wlPuzzle.end, 'target', null));
      const undoBtn = document.getElementById('wl-undo');
      if (undoBtn) undoBtn.disabled = wlHistory.length <= 1;
      document.getElementById('wl-step-count').textContent = wlHistory.length - 1;
      const firstInput = document.querySelector('.wl-preview-input');
      if (firstInput) firstInput.focus();
    }
    function wlRungEl(word, type, compareWord) {
      const div = document.createElement('div');
      div.className = `wl-rung ${type}`;
      for (let i = 0; i < word.length; i++) {
        const cell = document.createElement('div');
        cell.className = 'wl-letter';
        if (compareWord && word[i] !== compareWord[i]) cell.classList.add('changed');
        cell.textContent = word[i];
        div.appendChild(cell);
      }
      return div;
    }
    function wlArrowEl() { const a = document.createElement('div'); a.className = 'wl-arrow'; a.textContent = '↓'; return a; }
    function wlPreviewRowEl(prevWord) {
      const div = document.createElement('div');
      div.className = 'wl-rung preview';
      for (let i = 0; i < prevWord.length; i++) {
        const cell = document.createElement('div');
        cell.className = 'wl-letter';
        const inp = document.createElement('input');
        inp.className = 'wl-preview-input';
        inp.maxLength = 1;
        inp.value = prevWord[i];
        inp.dataset.idx = i;
        inp.addEventListener('input', wlOnLetterInput);
        inp.addEventListener('keydown', wlOnLetterKey);
        cell.appendChild(inp);
        div.appendChild(cell);
      }
      return div;
    }
    function wlOnLetterInput(e) {
      const v = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
      e.target.value = v;
      wlValidatePreview();
      if (v && +e.target.dataset.idx < wlLength - 1) {
        const next = document.querySelector(`.wl-preview-input[data-idx="${+e.target.dataset.idx + 1}"]`);
        if (next) next.focus();
      }
    }
    function wlOnLetterKey(e) {
      if (e.key === 'Enter') { e.preventDefault(); wlSubmit(); }
      else if (e.key === 'Backspace' && !e.target.value) {
        const prev = document.querySelector(`.wl-preview-input[data-idx="${+e.target.dataset.idx - 1}"]`);
        if (prev) prev.focus();
      } else if (e.key === 'ArrowLeft') {
        const prev = document.querySelector(`.wl-preview-input[data-idx="${+e.target.dataset.idx - 1}"]`);
        if (prev) { e.preventDefault(); prev.focus(); }
      } else if (e.key === 'ArrowRight') {
        const next = document.querySelector(`.wl-preview-input[data-idx="${+e.target.dataset.idx + 1}"]`);
        if (next) { e.preventDefault(); next.focus(); }
      }
    }
    function wlReadPreview() {
      return Array.from(document.querySelectorAll('.wl-preview-input')).map(i => i.value || '_').join('');
    }
    function wlValidatePreview() {
      const candidate = wlReadPreview();
      const prev = wlHistory[wlHistory.length - 1];
      const row = document.querySelector('.wl-rung.preview');
      if (!row) return;
      if (candidate.includes('_')) { row.classList.remove('invalid'); return; }
      let diffs = 0;
      for (let i = 0; i < prev.length; i++) if (prev[i] !== candidate[i]) diffs++;
      row.querySelectorAll('.wl-letter').forEach((cell, i) => cell.classList.toggle('changed', candidate[i] !== prev[i]));
      row.classList.toggle('invalid', diffs !== 1);
    }
    function wlSubmit() {
      const candidate = wlReadPreview();
      const prev = wlHistory[wlHistory.length - 1];
      const fb = document.getElementById('wl-feedback');
      if (candidate.includes('_') || candidate.length !== wlLength) { fb.textContent = 'Fill in all letters first.'; fb.className = 'wl-feedback error'; return; }
      let diffs = 0;
      for (let i = 0; i < prev.length; i++) if (prev[i] !== candidate[i]) diffs++;
      if (diffs === 0) { fb.textContent = 'You need to change exactly one letter.'; fb.className = 'wl-feedback error'; return; }
      if (diffs > 1) { fb.textContent = `That changes ${diffs} letters — only 1 allowed!`; fb.className = 'wl-feedback error'; return; }
      if (!WL_SETS[wlLength].has(candidate)) { fb.textContent = `"${candidate}" isn't in our word list — try another.`; fb.className = 'wl-feedback error'; return; }
      if (wlHistory.includes(candidate)) { fb.textContent = 'You already used that word!'; fb.className = 'wl-feedback error'; return; }
      wlHistory.push(candidate);
      fb.textContent = ''; fb.className = 'wl-feedback';
      wlRenderLadder();
      if (candidate === wlPuzzle.end) wlVictory();
    }
    function wlVictory() {
      const steps = wlHistory.length - 1;
      wlSolved++;
      localStorage.setItem('wordladder_solved', JSON.stringify(wlSolved));
      const key = `${wlLength}`;
      const prevBest = wlBest[key];
      if (!prevBest || steps < prevBest) { wlBest[key] = steps; localStorage.setItem('wordladder_best', JSON.stringify(wlBest)); }
      let extra = '';
      if (steps === wlPuzzle.optimal) extra = ' That\'s the optimal path! 🌟';
      else if (steps <= wlPuzzle.optimal + 1) extra = ' Excellent work!';
      else extra = ` (Optimal was ${wlPuzzle.optimal} — try again!)`;
      showGameVictory('🪜 You did it!',
        `You climbed the ladder in <strong>${steps}</strong> step${steps!==1?'s':''}.${extra}`,
        `<div class="wl-word-path">${wlHistory.join(' → ')}</div><button onclick="newLadderPuzzle();hideGameVictory()" style="background:var(--peri)">Next Puzzle →</button>`);
    }
    function wlUndo() { if (wlHistory.length > 1) { wlHistory.pop(); wlRenderLadder(); } }
    function wlReset() { wlHistory = [wlPuzzle.start]; wlRenderLadder(); document.getElementById('wl-feedback').textContent = ''; }

    const AS_VALID = new Set(AS_RAW.trim().split(/\s+/).map(w => w.toUpperCase()));

    const AS_POOLS = {
      easy:   ['STAR', 'NEAT', 'PALE', 'CARE', 'TIME', 'ROSE', 'NOTE', 'LIME', 'TEAR', 'DEAL'],
      medium: ['STARE', 'TRAIN', 'PLATE', 'HEART', 'STONE', 'TABLE', 'GRACE', 'BREAD', 'CHEAT', 'NORTH', 'STEAM', 'TRADE', 'PLANE', 'LATER', 'EARTH', 'SHARE'],
      hard:   ['TRAINS', 'LISTEN', 'STREAM', 'SPRINT', 'MASTER', 'PARENT', 'PLATES', 'STARED', 'CASTLE', 'LEADER', 'STAINS', 'POSTER']
    };

    function asCanForm(word, letters) {
      const counts = {};
      for (const c of letters) counts[c] = (counts[c] || 0) + 1;
      for (const c of word) { if (!counts[c]) return false; counts[c]--; }
      return true;
    }
    function asFindAllValid(letters) {
      const result = [];
      for (const word of AS_VALID) {
        if (word.length < 3) continue;
        if (word.length > letters.length) continue;
        if (asCanForm(word, letters)) result.push(word);
      }
      return result.sort((a, b) => b.length - a.length || a.localeCompare(b));
    }
    function asPickPool(diff) {
      const pools = AS_POOLS[diff];
      for (let attempt = 0; attempt < 8; attempt++) {
        const candidate = pools[~~(Math.random() * pools.length)];
        const valid = asFindAllValid(candidate);
        const min = diff === 'easy' ? 6 : diff === 'medium' ? 12 : 18;
        if (valid.length >= min) return { letters: candidate, valid };
      }
      const candidate = pools[0];
      return { letters: candidate, valid: asFindAllValid(candidate) };
    }
    function asPointsFor(word) {
      const len = word.length;
      if (len === 3) return 1;
      if (len === 4) return 3;
      if (len === 5) return 6;
      if (len === 6) return 10;
      if (len === 7) return 15;
      return 20;
    }

    let asDifficulty = 'medium', asPool = '', asValid = [], asFound = [], asScore = 0;
    let asTimeLeft = 60, asTimer = null, asView = 'start';
    const asHi = JSON.parse(localStorage.getItem('anagram_hi') || '{}');

    function resetAnagram() { asView = 'start'; if (asTimer) { clearInterval(asTimer); asTimer = null; } asFound = []; asScore = 0; }

    function renderAnagramView() {
      return `
        <button class="game-back" onclick="backToChillMenu()">← Back to Chill Zone</button>
        <div class="game-header"><h2>⚡ Anagram Sprint</h2><p>Find as many words as you can — beat the clock!</p></div>
        <div class="game-card" id="as-content"></div>`;
    }

    function anagramShowStart() {
      asView = 'start';
      const el = document.getElementById('as-content');
      if (!el) return;
      const hi = asHi[asDifficulty] || 0;
      el.innerHTML = `
        <div class="as-start-row">
          <p style="color:var(--muted);margin-bottom:6px">Pick your difficulty</p>
          <div class="as-diff-row">
            <div class="as-diff-card ${asDifficulty==='easy'?'active':''}" onclick="setAsDiff('easy')">
              <div class="name">🌱 Easy</div><div class="desc">4 letters · 90 sec<br>Middle school friendly</div>
            </div>
            <div class="as-diff-card ${asDifficulty==='medium'?'active':''}" onclick="setAsDiff('medium')">
              <div class="name">⚡ Medium</div><div class="desc">5 letters · 75 sec<br>The classic mode</div>
            </div>
            <div class="as-diff-card ${asDifficulty==='hard'?'active':''}" onclick="setAsDiff('hard')">
              <div class="name">🔥 Hard</div><div class="desc">6 letters · 60 sec<br>For word lovers</div>
            </div>
          </div>
          <button class="as-start-btn" onclick="anagramStart()">Start Sprint →</button>
          <div class="as-hi-score">High score (${asDifficulty}): <strong>${hi}</strong> points</div>
        </div>`;
    }
    function setAsDiff(d) { asDifficulty = d; anagramShowStart(); }

    function anagramStart() {
      const setup = asPickPool(asDifficulty);
      asPool = setup.letters.split('').sort(() => Math.random() - 0.5).join('');
      asValid = setup.valid;
      asFound = []; asScore = 0;
      asTimeLeft = asDifficulty === 'easy' ? 90 : asDifficulty === 'medium' ? 75 : 60;
      asView = 'play';
      anagramRenderGame();
      if (asTimer) clearInterval(asTimer);
      asTimer = setInterval(() => {
        asTimeLeft--;
        const tEl = document.getElementById('as-time');
        if (tEl) tEl.textContent = asTimeLeft;
        if (asTimeLeft <= 10) document.getElementById('as-hud-timer')?.classList.add('warn');
        if (asTimeLeft <= 0) anagramEnd();
      }, 1000);
    }

    function anagramRenderGame() {
      const el = document.getElementById('as-content');
      if (!el) return;
      const tilesHTML = asPool.split('').map((c, i) => `<div class="as-letter-tile" data-idx="${i}" onclick="asAddLetter(${i})">${c}</div>`).join('');
      el.innerHTML = `
        <div class="as-hud">
          <div class="as-hud-stat"><div class="label">Score</div><div class="val" id="as-score">${asScore}</div></div>
          <div class="as-hud-stat"><div class="label">Found</div><div class="val" id="as-found">${asFound.length} / ${asValid.length}</div></div>
          <div class="as-hud-stat timer" id="as-hud-timer"><div class="label">Time</div><div class="val" id="as-time">${asTimeLeft}</div></div>
        </div>
        <div class="as-letters" id="as-letters">${tilesHTML}</div>
        <button class="as-shuffle-btn" onclick="asShuffle()">🔀 Shuffle</button>
        <div class="as-input-area">
          <input type="text" class="as-word-input" id="as-input" placeholder="Type a word…" autocomplete="off" oninput="asTyping()" onkeydown="asKey(event)">
          <button class="as-submit-btn" onclick="asSubmit()">Submit</button>
        </div>
        <div class="as-feedback" id="as-feedback"></div>
        <div class="as-found-words"><div class="as-found-label">Words found</div><div id="as-found-list" class="as-found-list"></div></div>`;
      const inp = document.getElementById('as-input');
      if (inp) inp.focus();
      asRefreshFound();
    }
    function asTyping() {
      const input = document.getElementById('as-input');
      if (!input) return;
      const v = input.value.toUpperCase().replace(/[^A-Z]/g, '');
      input.value = v;
      const used = {};
      for (const c of v) used[c] = (used[c] || 0) + 1;
      const tiles = document.querySelectorAll('.as-letter-tile');
      const seen = {};
      tiles.forEach(t => { const c = t.textContent; seen[c] = (seen[c] || 0) + 1; t.classList.toggle('used', seen[c] <= (used[c] || 0)); });
    }
    function asKey(e) { if (e.key === 'Enter') { e.preventDefault(); asSubmit(); } }
    function asAddLetter(idx) {
      const input = document.getElementById('as-input');
      const tiles = document.querySelectorAll('.as-letter-tile');
      const tile = tiles[idx];
      if (tile.classList.contains('used')) return;
      input.value = (input.value + asPool[idx]).toUpperCase();
      asTyping();
      input.focus();
    }
    function asSubmit() {
      const input = document.getElementById('as-input');
      const word = input.value.toUpperCase().trim();
      if (!word) return;
      if (word.length < 3) { asShowFb('Words must be at least 3 letters.', 'error'); return; }
      if (!asCanForm(word, asPool)) { asShowFb(`Can't make "${word}" from those letters.`, 'error'); return; }
      if (asFound.includes(word)) { asShowFb(`Already found "${word}"!`, 'error'); return; }
      if (!AS_VALID.has(word)) { asShowFb(`"${word}" isn't in our word list.`, 'error'); return; }
      const pts = asPointsFor(word);
      asFound.push(word);
      asScore += pts;
      document.getElementById('as-score').textContent = asScore;
      document.getElementById('as-found').textContent = `${asFound.length} / ${asValid.length}`;
      const isPangram = word.length === asPool.length;
      asShowFb(`+${pts} points · ${word}${isPangram ? ' · PANGRAM! 🌟' : ''}`, 'success');
      input.value = ''; asTyping(); asRefreshFound();
      if (asFound.length === asValid.length) anagramEnd();
    }
    function asShowFb(msg, cls) {
      const fb = document.getElementById('as-feedback');
      if (!fb) return;
      fb.textContent = msg; fb.className = `as-feedback ${cls}`;
      setTimeout(() => { if (fb.textContent === msg) fb.className = 'as-feedback'; }, 1200);
    }
    function asRefreshFound() {
      const list = document.getElementById('as-found-list');
      if (!list) return;
      if (asFound.length === 0) { list.innerHTML = '<div class="as-found-empty">Find your first word to get started…</div>'; return; }
      const sorted = [...asFound].sort((a, b) => b.length - a.length || a.localeCompare(b));
      list.innerHTML = sorted.map(w => `<span class="as-found-pill ${w.length === asPool.length ? 'bonus' : ''}">${w}</span>`).join('');
    }
    function asShuffle() {
      const arr = asPool.split('');
      for (let i = arr.length - 1; i > 0; i--) { const j = ~~(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
      asPool = arr.join('');
      const ltrs = document.getElementById('as-letters');
      if (ltrs) ltrs.innerHTML = asPool.split('').map((c, i) => `<div class="as-letter-tile" data-idx="${i}" onclick="asAddLetter(${i})">${c}</div>`).join('');
      asTyping();
    }
    function anagramEnd() {
      if (asTimer) { clearInterval(asTimer); asTimer = null; }
      const isHi = (asHi[asDifficulty] || 0) < asScore;
      if (isHi) { asHi[asDifficulty] = asScore; localStorage.setItem('anagram_hi', JSON.stringify(asHi)); }
      const missed = asValid.filter(w => !asFound.includes(w));
      const missedHTML = missed.length
        ? missed.slice(0, 30).map(w => `<span class="miss">${w}</span>`).join('')
        : '<span style="color:var(--green);font-weight:600">You found them all! 🌟</span>';
      const el = document.getElementById('as-content');
      if (!el) return;
      el.innerHTML = `
        <div class="as-end-screen">
          <h2>${asFound.length === asValid.length ? '🏆 Perfect!' : "⏰ Time's up!"}</h2>
          <div class="as-final-score">${asScore}</div>
          <div class="as-final-label">Final Score${isHi ? ' · <span class="as-new-high">NEW HIGH! ⭐</span>' : ''}</div>
          <div class="as-stat-grid">
            <div class="as-stat-cell"><div class="n">${asFound.length}</div><div class="l">Words Found</div></div>
            <div class="as-stat-cell"><div class="n">${asValid.length}</div><div class="l">Total Possible</div></div>
            <div class="as-stat-cell"><div class="n">${Math.round(asFound.length / asValid.length * 100)}%</div><div class="l">Completion</div></div>
          </div>
          <div class="as-missed-section">
            <div class="label">${missed.length ? `Words you missed (showing ${Math.min(missed.length, 30)} of ${missed.length})` : 'Status'}</div>
            <div class="as-missed-list">${missedHTML}</div>
          </div>
          <button class="as-start-btn" style="margin-top:16px" onclick="anagramShowStart()">Play Again →</button>
        </div>`;
    }
  </script>
</body>
</html>
