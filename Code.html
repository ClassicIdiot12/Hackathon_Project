<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HallPass — Tyee Community Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f3ec;
      --bg2: #ede7dc;
      --card: #ffffff;
      --navy: #1c2b4a;
      --coral: #e8523f;
      --green: #3a9e7a;
      --amber: #f0a218;
      --peri: #5b6ee8;
      --text: #1e1e1e;
      --muted: #6b6b6b;
      --border: rgba(0, 0, 0, 0.08);
      --sh-sm: 0 2px 8px rgba(0, 0, 0, 0.07);
      --sh-md: 0 4px 20px rgba(0, 0, 0, 0.10);
      --sh-lg: 0 8px 40px rgba(0, 0, 0, 0.15);
      --r: 12px;
      --r-sm: 8px;
      --display: 'Fraunces', serif;
      --body: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      font-family: var(--body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 60%, rgba(212, 169, 106, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 85% 15%, rgba(91, 110, 232, 0.07) 0%, transparent 40%);
    }

    /* AUTH SCREEN */
    #auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-box {
      background: var(--card);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--sh-lg);
      border: 1px solid var(--border);
      animation: popIn .4s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(.92) translateY(16px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .auth-logo {
      font-family: var(--display);
      font-size: 36px;
      font-weight: 900;
      color: var(--navy);
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-logo span {
      color: var(--amber);
    }

    .auth-tagline {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .auth-tabs {
      display: flex;
      background: var(--bg2);
      border-radius: var(--r);
      padding: 4px;
      margin-bottom: 28px;
    }

    .auth-tab {
      flex: 1;
      padding: 9px;
      border-radius: var(--r-sm);
      border: none;
      background: transparent;
      font-family: var(--body);
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all .18s;
    }

    .auth-tab.active {
      background: var(--card);
      color: var(--navy);
      box-shadow: var(--sh-sm);
    }

    .auth-form-row {
      margin-bottom: 16px;
    }

    .auth-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .auth-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--r-sm);
      border: 2px solid var(--border);
      font-family: var(--body);
      font-size: 15px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }

    .auth-input:focus {
      border-color: var(--peri);
      background: var(--card);
    }

    .auth-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .auth-submit {
      width: 100%;
      padding: 14px;
      border-radius: var(--r);
      border: none;
      background: var(--navy);
      color: #fff;
      font-family: var(--body);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      margin-top: 4px;
    }

    .auth-submit:hover {
      background: #2a3f6b;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(28, 43, 74, .3);
    }

    .auth-error {
      background: rgba(232, 82, 63, 0.09);
      border: 1px solid rgba(232, 82, 63, 0.25);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--coral);
      margin-bottom: 16px;
      display: none;
    }

    .auth-footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.6;
    }

    /* MAIN APP */
    #main-app {
      display: none;
    }

    header {
      background: var(--navy);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.22);
    }

    .logo {
      font-family: var(--display);
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      padding: 18px 0;
      letter-spacing: -0.5px;
      white-space: nowrap;
      user-select: none;
    }

    .logo span {
      color: var(--amber);
    }

    .nav-tabs {
      display: flex;
      gap: 4px;
      flex: 1;
      flex-wrap: wrap;
    }

    .nav-tab {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      transition: all .2s;
      border: none;
      background: none;
      font-family: var(--body);
    }

    .nav-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-tab.active {
      color: var(--navy);
      background: #fff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 20px;
      padding: 6px 14px 6px 8px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--amber);
      color: var(--navy);
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: rgba(255, 255, 255, 0.65);
      font-family: var(--body);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: all .15s;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .post-btn {
      background: var(--amber);
      color: var(--navy);
      border: none;
      padding: 10px 22px;
      border-radius: 24px;
      font-family: var(--body);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }

    .post-btn:hover {
      background: #fbb62a;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(240, 162, 24, 0.45);
    }

    /* LAYOUT & COMPONENTS */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .stats-bar {
      display: flex;
      gap: 14px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--card);
      border-radius: var(--r);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--sh-sm);
      border: 1px solid var(--border);
    }

    .stat-chip .num {
      font-family: var(--display);
      font-size: 30px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1;
    }

    .stat-chip .lbl {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.4;
    }

    .lf-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
      align-items: start;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .scard {
      background: var(--card);
      border-radius: var(--r);
      padding: 20px;
      box-shadow: var(--sh-sm);
      border: 1px solid var(--border);
    }

    .scard-title {
      font-family: var(--display);
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 14px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-btn {
      padding: 8px 14px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: transparent;
      font-family: var(--body);
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      transition: all .15s;
    }

    .filter-btn:hover {
      background: var(--bg2);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    /* MY STATS */
    .my-stats {
      background: linear-gradient(135deg, var(--navy) 0%, #2d4470 100%);
      border-radius: var(--r);
      padding: 20px;
      color: #fff;
    }

    .my-stats-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 12px;
    }

    .my-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .my-stat {
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--r-sm);
      padding: 10px 12px;
    }

    .my-stat .n {
      font-family: var(--display);
      font-size: 22px;
      font-weight: 700;
      color: var(--amber);
      line-height: 1;
    }

    .my-stat .l {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 3px;
    }

    /* LEADERBOARD */
    .leader-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .leader-rank {
      font-size: 18px;
      width: 28px;
      text-align: center;
    }

    .leader-name {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
    }

    .leader-pts {
      font-size: 12px;
      font-weight: 700;
      color: var(--amber);
      background: rgba(240, 162, 24, 0.12);
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* ITEM CARDS */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
    }

    .item-card {
      background: var(--card);
      border-radius: var(--r);
      padding: 20px;
      box-shadow: var(--sh-sm);
      border: 1px solid var(--border);
      border-top: 4px solid var(--acc);
      cursor: pointer;
      transition: transform .28s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s;
      position: relative;
      transform: rotate(var(--tilt));
    }

    .item-card::before {
      content: '📌';
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18));
      transition: transform .28s;
    }

    .item-card:hover {
      transform: rotate(0deg) translateY(-5px) scale(1.02);
      box-shadow: var(--sh-lg);
      z-index: 3;
    }

    .item-card.found {
      opacity: 0.65;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .status-badge.open {
      background: rgba(232, 82, 63, 0.12);
      color: var(--coral);
    }

    .status-badge.found {
      background: rgba(58, 158, 122, 0.12);
      color: var(--green);
    }

    .card-title {
      font-family: var(--display);
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 5px;
    }

    /* ============================== */
    /* HOMEWORK & HELP TAB            */
    /* ============================== */
    .hw-feed {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .hw-feed-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .hw-feed-header h2 {
      font-family: var(--display);
      font-size: 28px;
      font-weight: 900;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .hw-feed-header .sub {
      font-size: 13px;
      color: var(--muted);
    }

    .hw-empty {
      background: var(--card);
      border-radius: var(--r);
      padding: 48px 24px;
      text-align: center;
      border: 2px dashed var(--border);
      color: var(--muted);
    }

    .hw-empty .em {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hw-empty h4 {
      font-family: var(--display);
      font-size: 18px;
      color: var(--navy);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .hw-post {
      background: var(--card);
      border-radius: var(--r);
      box-shadow: var(--sh-sm);
      border: 1px solid var(--border);
      border-left: 4px solid var(--peri);
      overflow: hidden;
      transition: box-shadow .2s;
    }

    .hw-post:hover {
      box-shadow: var(--sh-md);
    }

    .hw-post-head {
      padding: 18px 22px 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .hw-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--peri), #8794f0);
      color: #fff;
      font-family: var(--display);
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hw-avatar.teacher {
      background: linear-gradient(135deg, var(--amber), #f5bf57);
      color: var(--navy);
    }

    .hw-meta {
      flex: 1;
      min-width: 0;
    }

    .hw-author {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
    }

    .hw-author .role-tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 6px;
      vertical-align: 2px;
    }

    .hw-author .role-tag.student {
      background: rgba(91, 110, 232, 0.15);
      color: var(--peri);
    }

    .hw-author .role-tag.teacher {
      background: rgba(240, 162, 24, 0.18);
      color: #b87a0a;
    }

    .hw-time {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    .hw-body {
      padding: 4px 22px 18px;
    }

    .hw-topic {
      font-family: var(--display);
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .hw-details {
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .hw-actions {
      padding: 10px 22px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .reply-count {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .reply-count strong {
      color: var(--navy);
      font-weight: 700;
    }

    .reply-btn {
      margin-left: auto;
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-family: var(--body);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .18s;
    }

    .reply-btn:hover {
      background: #2a3f6b;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(28, 43, 74, 0.28);
    }

    .reply-btn.alt {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 14px;
    }

    .reply-btn.alt:hover {
      background: var(--bg2);
      color: var(--navy);
      transform: none;
      box-shadow: none;
    }

    .hw-replies {
      background: var(--bg);
      padding: 4px 22px 18px;
      display: none;
      border-top: 1px solid var(--border);
    }

    .hw-replies.open {
      display: block;
      animation: fadeIn .25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reply-item {
      display: flex;
      gap: 10px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .reply-item:last-child {
      border-bottom: none;
    }

    .reply-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), #5fc498);
      color: #fff;
      font-family: var(--display);
      font-weight: 800;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .reply-avatar.teacher {
      background: linear-gradient(135deg, var(--amber), #f5bf57);
      color: var(--navy);
    }

    .reply-content {
      flex: 1;
      min-width: 0;
    }

    .reply-author {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
    }

    .reply-author .role-tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 1px 6px;
      border-radius: 9px;
      margin-left: 5px;
      vertical-align: 2px;
    }

    .reply-author .role-tag.student {
      background: rgba(91, 110, 232, 0.15);
      color: var(--peri);
    }

    .reply-author .role-tag.teacher {
      background: rgba(240, 162, 24, 0.18);
      color: #b87a0a;
    }

    .reply-time {
      font-size: 11px;
      color: var(--muted);
      margin-left: 4px;
    }

    .reply-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      margin-top: 3px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .reply-form {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      margin-top: 4px;
    }

    .reply-form textarea {
      flex: 1;
      min-height: 64px;
      padding: 10px 14px;
      border-radius: var(--r-sm);
      border: 2px solid var(--border);
      font-family: var(--body);
      font-size: 14px;
      background: var(--card);
      outline: none;
      resize: vertical;
      transition: border-color .15s;
    }

    .reply-form textarea:focus {
      border-color: var(--peri);
    }

    .reply-form button {
      background: var(--peri);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: var(--r-sm);
      font-family: var(--body);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      align-self: stretch;
      transition: all .18s;
    }

    .reply-form button:hover {
      background: #4a5dd6;
    }

    /* ============================== */
    /* SUB BOARD                      */
    /* ============================== */
    .sub-feed {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .sub-feed-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .sub-feed-header h2 {
      font-family: var(--display);
      font-size: 28px;
      font-weight: 900;
      color: var(--navy);
      letter-spacing: -0.5px;
    }

    .sub-feed-header .sub {
      font-size: 13px;
      color: var(--muted);
    }

    .sub-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
    }

    .sub-filter-btn {
      padding: 6px 14px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--card);
      font-family: var(--body);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
    }

    .sub-filter-btn:hover {
      background: var(--bg2);
      color: var(--navy);
    }

    .sub-filter-btn.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .sub-post {
      background: var(--card);
      border-radius: var(--r);
      box-shadow: var(--sh-sm);
      border: 1px solid var(--border);
      border-left: 4px solid var(--amber);
      overflow: hidden;
      transition: box-shadow .2s, opacity .2s;
    }

    .sub-post:hover {
      box-shadow: var(--sh-md);
    }

    .sub-post.covered {
      border-left-color: var(--green);
      opacity: 0.78;
    }

    .sub-post-tag-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px 0;
    }

    .sub-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 10px;
      background: rgba(240, 162, 24, 0.18);
      color: #b87a0a;
    }

    .sub-post.covered .sub-tag {
      background: rgba(58, 158, 122, 0.16);
      color: var(--green);
    }

    .sub-status-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .sub-status-badge.pending {
      background: rgba(232, 82, 63, 0.12);
      color: var(--coral);
    }

    .sub-status-badge.covered {
      background: rgba(58, 158, 122, 0.16);
      color: var(--green);
    }

    .sub-post-body {
      padding: 12px 22px 18px;
    }

    .sub-class-title {
      font-family: var(--display);
      font-size: 22px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .sub-when {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--peri);
      background: rgba(91, 110, 232, 0.10);
      padding: 4px 10px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .sub-notes {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      padding: 14px 16px;
      background: var(--bg);
      border-radius: var(--r-sm);
      border: 1px dashed var(--border);
    }

    .sub-post-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }

    .sub-author-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--navy);
    }

    .sub-author-chip .av {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--amber), #f5bf57);
      color: var(--navy);
      font-family: var(--display);
      font-weight: 800;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sub-author-chip .av.student {
      background: linear-gradient(135deg, var(--peri), #8794f0);
      color: #fff;
    }

    .sub-actions {
      padding: 10px 22px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sub-comment-count {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .sub-comment-count strong {
      color: var(--navy);
      font-weight: 700;
    }

    .sub-cover-btn {
      margin-left: auto;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: var(--body);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s;
    }

    .sub-cover-btn:hover {
      background: #2f8767;
      transform: translateY(-1px);
    }

    .sub-cover-btn.reopen {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .sub-cover-btn.reopen:hover {
      background: var(--bg2);
      color: var(--navy);
      transform: none;
    }

    .sub-comment-btn {
      background: var(--navy);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: var(--body);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s;
    }

    .sub-comment-btn:hover {
      background: #2a3f6b;
      transform: translateY(-1px);
    }

    .sub-comments {
      background: var(--bg);
      padding: 4px 22px 18px;
      display: none;
      border-top: 1px solid var(--border);
    }

    .sub-comments.open {
      display: block;
      animation: fadeIn .25s ease;
    }

    /* MODAL */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 43, 74, 0.52);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      background: var(--bg);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 680px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 -8px 50px rgba(0, 0, 0, 0.22);
      animation: slideUp .32s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .handle {
      width: 48px;
      height: 4px;
      background: var(--bg2);
      border-radius: 2px;
      margin: 0 auto 26px;
    }

    .modal h3 {
      font-family: var(--display);
      font-size: 22px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .modal-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 6px;
    }

    /* ITEM DETAIL MODAL */
    .detail-hero {
      text-align: center;
      padding: 18px 0 22px;
      background: var(--bg2);
      border-radius: var(--r);
      margin-bottom: 18px;
      position: relative;
    }

    .detail-emoji {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 8px;
      display: inline-block;
    }

    .detail-hero .status-badge {
      position: absolute;
      top: 12px;
      right: 12px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text);
    }

    .detail-row .lbl {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      min-width: 76px;
    }

    .sbtn.ghost {
      background: transparent;
      color: var(--navy);
      border: 2px solid var(--border);
      margin-top: 6px;
    }

    .sbtn.ghost:hover {
      background: var(--bg2);
      border-color: var(--navy);
    }

    .sbtn.coral {
      background: var(--coral);
    }

    .sbtn.coral:hover {
      background: #d3422f;
    }

    .sbtn.green {
      background: var(--green);
    }

    .sbtn.green:hover {
      background: #2f8767;
    }

    /* BREATHING EXERCISE */
    .breathe-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px 32px;
      gap: 24px;
    }

    .breathe-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #8794f0, var(--peri) 70%);
      box-shadow: 0 12px 50px rgba(91, 110, 232, 0.45);
      transform: scale(0.5);
      transition: transform 4s ease-in-out;
    }

    .breathe-circle.expand {
      transform: scale(1.15);
    }

    .breathe-label {
      font-family: var(--display);
      font-size: 26px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.5px;
      min-height: 36px;
    }

    .breathe-cycle-count {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* GARDEN */
    .garden-stage {
      position: relative;
      width: 100%;
      height: 360px;
      border-radius: var(--r);
      background: linear-gradient(180deg, #c5e8f5 0%, #cfe9b8 55%, #97c976 100%);
      overflow: hidden;
      cursor: crosshair;
      margin-bottom: 14px;
      box-shadow: inset 0 -8px 30px rgba(0, 0, 0, 0.08);
    }

    .garden-stage::before {
      content: '☀️';
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 32px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.15));
    }

    .garden-flower {
      position: absolute;
      transform: translate(-50%, -50%) scale(0);
      animation: bloom .55s cubic-bezier(.34, 1.56, .64, 1) forwards;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.18));
      user-select: none;
    }

    @keyframes bloom {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-30deg); }
      60% { transform: translate(-50%, -50%) scale(1.2) rotate(8deg); }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    }

    .garden-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .garden-info .count {
      background: var(--bg2);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      color: var(--navy);
    }

    /* CHILL CARD ENHANCEMENTS */
    .chill-card {
      position: relative;
      overflow: hidden;
    }

    .chill-card h3 {
      font-family: var(--display);
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .chill-card p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    .chill-card .chill-cta {
      display: inline-block;
      margin-top: 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--peri);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* FORMS */
    .finput,
    .ftextarea,
    .fselect {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--r-sm);
      border: 2px solid var(--border);
      font-family: var(--body);
      font-size: 14px;
      background: var(--card);
      outline: none;
      margin-bottom: 10px;
      transition: border-color .15s;
    }

    .finput:focus,
    .ftextarea:focus {
      border-color: var(--peri);
    }

    .ftextarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.5;
    }

    .sbtn {
      width: 100%;
      padding: 14px;
      border-radius: var(--r);
      border: none;
      background: var(--navy);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--body);
      font-size: 15px;
      transition: all .18s;
      margin-top: 8px;
    }

    .sbtn:hover {
      background: #2a3f6b;
      transform: translateY(-1px);
    }

    /* CHILL ZONE */
    .chill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .chill-card {
      background: var(--card);
      border-radius: 20px;
      padding: 32px 26px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .2s;
    }

    .chill-card:hover {
      transform: translateY(-5px);
    }

    @media (max-width: 780px) {
      .lf-layout {
        grid-template-columns: 1fr;
      }

      .nav-tab {
        padding: 8px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">📌 Hall<span>Pass</span></div>
      <div class="auth-tagline">Tyee Middle School Community Board</div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="authTab('login')">Log In</button>
        <button class="auth-tab" id="tab-signup" onclick="authTab('signup')">Create Account</button>
      </div>

      <div id="auth-error" class="auth-error"></div>

      <div id="form-login">
        <div class="auth-form-row">
          <label class="auth-label">Username</label>
          <input class="auth-input" id="li-user" type="text" placeholder="e.g. jayden_k">
        </div>
        <div class="auth-form-row">
          <label class="auth-label">Password</label>
          <input class="auth-input" id="li-pass" type="password" placeholder="••••••••">
        </div>
        <button class="auth-submit" onclick="doLogin()">Log In →</button>
      </div>

      <div id="form-signup" style="display:none">
        <div class="auth-2col">
          <div class="auth-form-row">
            <label class="auth-label">First Name</label>
            <input class="auth-input" id="su-first" type="text" placeholder="Jayden">
          </div>
          <div class="auth-form-row">
            <label class="auth-label">Last Initial</label>
            <input class="auth-input" id="su-last" type="text" placeholder="K" maxlength="1">
          </div>
        </div>
        <div class="auth-form-row">
          <label class="auth-label">Username</label>
          <input class="auth-input" id="su-user" type="text" placeholder="jayden_k">
        </div>
        <div class="auth-form-row">
          <label class="auth-label">Password</label>
          <input class="auth-input" id="su-pass" type="password" placeholder="Choose password">
        </div>
        <div class="auth-form-row">
          <label class="auth-label">Role</label>
          <select class="auth-input" id="su-role">
            <option value="student">Student</option>
            <option value="teacher">Teacher / Staff</option>
          </select>
        </div>
        <button class="auth-submit" onclick="doSignup()">Create Account →</button>
      </div>
    </div>
  </div>

  <div id="main-app">
    <header>
      <div class="logo">📌 Hall<span>Pass</span></div>
      <nav class="nav-tabs">
        <button class="nav-tab active" id="btn-lost" onclick="switchTab('lost')">🔍 Lost & Found</button>
        <button class="nav-tab" id="btn-sub" onclick="switchTab('sub')">📋 Sub Board</button>
        <button class="nav-tab" id="btn-homework" onclick="switchTab('homework')">📚 Homework & Help</button>
        <button class="nav-tab" id="btn-chill" onclick="switchTab('chill')">🧘 Chill Zone</button>
      </nav>
      <div class="header-right">
        <div class="user-pill">
          <div class="user-avatar" id="hdr-avatar">?</div>
          <span class="user-name" id="hdr-name">User</span>
        </div>
        <button class="logout-btn" onclick="doLogout()">Log Out</button>
        <button class="post-btn" id="post-btn" onclick="openPostModal()">+ Post Item</button>
      </div>
    </header>
    <main class="container">
      <div id="app"></div>
    </main>
  </div>

  <div id="overlay" class="overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // 1. ACCOUNT MANAGER (STORES ALL DATA IN LOCALSTORAGE)
    class AccountManager {
      constructor() {
        this.storageKey = 'hallpass_accounts_v1';
        this.accounts = this.loadFromDisk();
        if (Object.keys(this.accounts).length === 0) this.seedInitialUsers();
      }
      seedInitialUsers() {
        const defaults = [
          { username: 'jayden_k', password: 'pass123', first: 'Jayden', last: 'K', role: 'student', points: 50 },
          { username: 'ms_peterson', password: 'teach1', first: 'Ms.', last: 'Peterson', role: 'teacher', points: 0 }
        ];
        defaults.forEach(u => this.addAccount(u.username, u));
      }
      addAccount(username, data) {
        this.accounts[username.toLowerCase()] = {
          username: username.toLowerCase(),
          ...data,
          createdAt: new Date().toISOString()
        };
        this.saveToDisk();
      }
      getAccount(username, password) {
        const user = this.accounts[username.toLowerCase()];
        return (user && user.password === password) ? user : null;
      }
      saveToDisk() { localStorage.setItem(this.storageKey, JSON.stringify(this.accounts)); }
      loadFromDisk() {
        const data = localStorage.getItem(this.storageKey);
        return data ? JSON.parse(data) : {};
      }
    }

    // 2. APP STATE
    const manager = new AccountManager();
    let currentUser = null;
    let currentTab = 'lost', filter = 'all', uid = 500;
    let openReplyBox = null; // tracks which homework post id has its reply form expanded
    let openSubCommentBox = null; // tracks which sub post id has its comment form expanded

    // 3. AUTH LOGIC
    function authTab(t) {
      document.getElementById('tab-login').classList.toggle('active', t === 'login');
      document.getElementById('tab-signup').classList.toggle('active', t === 'signup');
      document.getElementById('form-login').style.display = (t === 'login') ? 'block' : 'none';
      document.getElementById('form-signup').style.display = (t === 'signup') ? 'block' : 'none';
      hideErr();
    }

    function showErr(m) { const e = document.getElementById('auth-error'); e.textContent = m; e.style.display = 'block'; }
    function hideErr() { document.getElementById('auth-error').style.display = 'none'; }

    function doLogin() {
      const u = document.getElementById('li-user').value.trim();
      const p = document.getElementById('li-pass').value;
      const user = manager.getAccount(u, p);
      if (!user) { showErr('Incorrect username or password!'); return; }
      loginAs(user);
    }

    function doSignup() {
      const first = document.getElementById('su-first').value.trim();
      const last = document.getElementById('su-last').value.trim();
      const u = document.getElementById('su-user').value.trim();
      const p = document.getElementById('su-pass').value;
      const role = document.getElementById('su-role').value;

      if (!first || !u || !p) { showErr('Please fill in required fields!'); return; }
      if (manager.accounts[u.toLowerCase()]) { showErr('Username already exists!'); return; }

      const newUser = { password: p, first, last, role, points: 0 };
      manager.addAccount(u, newUser);
      loginAs(manager.accounts[u.toLowerCase()]);
    }

    function loginAs(user) {
      currentUser = user;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('hdr-avatar').textContent = user.first[0];
      document.getElementById('hdr-name').textContent = user.first + " " + (user.last ? user.last + "." : "");
      switchTab(user.role === 'teacher' ? 'sub' : 'lost');
    }

    function doLogout() {
      currentUser = null;
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
      authTab('login');
    }

    // 4. NAVIGATION & DATA
    function switchTab(t) {
      currentTab = t;
      openReplyBox = null;
      openSubCommentBox = null;
      document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${t}`).classList.add('active');

      // Update post button visibility & label per tab
      const postBtn = document.getElementById('post-btn');
      const labels = {
        lost: '+ Post Item',
        homework: '+ Ask for Help',
        sub: '+ Post Plan'
      };
      if (t === 'chill') {
        postBtn.style.display = 'none';
      } else {
        postBtn.style.display = 'block';
        postBtn.textContent = labels[t] || '+ Post';
      }
      render();
    }

    // MOCK DATA
    let items = [
      { id: 1, title: 'Creeper Keychain', cat: '🔑', loc: 'Office', by: 'Tyler W.', status: 'open', acc: '#3a9e7a', tilt: -2 },
      { id: 2, title: 'Stanley Cup', cat: '🍱', loc: 'Cafeteria', by: 'Priya K.', status: 'found', acc: '#5b6ee8', tilt: 1.5 }
    ];

    // HOMEWORK & HELP DATA - posts have topic, details, author info, replies
    let homeworkPosts = [
      {
        id: 'hw1',
        topic: 'Stuck on quadratic equations — what does "completing the square" actually mean?',
        details: "We're on chapter 4 in Algebra and I can solve them with the quadratic formula but Mr. Liu wants us to show completing the square. I get lost after moving the constant. Anyone have a clear way to think about it?",
        authorName: 'Jayden K.',
        authorRole: 'student',
        timestamp: Date.now() - 1000 * 60 * 60 * 5, // 5h ago
        replies: [
          {
            author: 'Ms. Peterson',
            role: 'teacher',
            text: "Great question! Think of it as turning x² + bx into a perfect square. Take half of b, square it, then add AND subtract that number. Want me to walk through one in office hours tomorrow?",
            timestamp: Date.now() - 1000 * 60 * 60 * 4
          }
        ]
      },
      {
        id: 'hw2',
        topic: 'Need help citing a YouTube video in MLA format',
        details: "It's for the science fair report. Do I use the channel name or the uploader's real name? And how do I handle the timestamp if I'm only quoting one part?",
        authorName: 'Priya K.',
        authorRole: 'student',
        timestamp: Date.now() - 1000 * 60 * 90, // 90 min ago
        replies: []
      }
    ];

    let subFilter = 'all'; // 'all' | 'pending' | 'covered'

    // SUB BOARD DATA - sub plans & class notes, anyone can post
    let subPosts = [
      {
        id: 'sb1',
        classPeriod: "Ms. Peterson's Algebra 1 — Period 4",
        when: 'Friday, Nov 8',

    // ========== CHILL ZONE ACTIVITIES ==========
    let breathingTimer = null;
    let gardenFlowers = [];

    function openChillActivity(type) {
      if (type === 'breathing') openBreathing();
      else if (type === 'garden') openGarden();
    }

    function openBreathing() {
      setModal(`
        <div class="handle"></div>
        <h3 style="text-align:center">🌬️ Breathing</h3>
        <p class="modal-sub" style="text-align:center">Follow the circle. 4 in, hold 2, 4 out.</p>
        <div class="breathe-stage">
          <div class="breathe-circle" id="breathe-circle"></div>
          <div class="breathe-label" id="breathe-label">Get ready…</div>
          <div class="breathe-cycle-count" id="breathe-cycles">Cycle 0</div>
        </div>
        <button class="sbtn ghost" onclick="closeModal()">Done</button>
      `);
      startBreathingAnim();
    }

    function startBreathingAnim() {
      const circle = document.getElementById('breathe-circle');
      const label = document.getElementById('breathe-label');
      const cyclesEl = document.getElementById('breathe-cycles');
      if (!circle || !label) return;

      // Phases: inhale 4s -> hold 2s -> exhale 4s -> rest 1s = 11s cycle
      const phases = [
        { text: 'Breathe in…', dur: 4000, expand: true },
        { text: 'Hold', dur: 2000, expand: true },
        { text: 'Breathe out…', dur: 4000, expand: false },
        { text: 'Rest', dur: 1000, expand: false }
      ];
      let phaseIdx = 0;
      let cycles = 0;

      function nextPhase() {
        const p = phases[phaseIdx];
        label.textContent = p.text;
        circle.classList.toggle('expand', p.expand);
        if (phaseIdx === 0) {
          cycles++;
          cyclesEl.textContent = `Cycle ${cycles}`;
        }
        phaseIdx = (phaseIdx + 1) % phases.length;
        breathingTimer = setTimeout(nextPhase, p.dur);
      }
      // Small delay so transition kicks in cleanly
      breathingTimer = setTimeout(nextPhase, 300);
    }

    function stopBreathingAnim() {
      if (breathingTimer) {
        clearTimeout(breathingTimer);
        breathingTimer = null;
      }
    }

    function openGarden() {
      setModal(`
        <div class="handle"></div>
        <h3 style="text-align:center">🌸 Garden</h3>
        <p class="modal-sub" style="text-align:center">Tap the grass to plant. Each one stays for the session.</p>
        <div class="garden-stage" id="garden-stage" onclick="plantFlower(event)">
          ${gardenFlowers.map(f => `<span class="garden-flower" style="left:${f.x}%; top:${f.y}%; font-size:${f.size}px">${f.emoji}</span>`).join('')}
        </div>
        <div class="garden-info">
          <span class="count" id="garden-count">${gardenFlowers.length} planted</span>
          <span>Each tap blooms a new flower 🌱</span>
          <button class="reply-btn alt" style="margin-left:auto" onclick="resetGarden()">Clear</button>
        </div>
      `);
    }

    function plantFlower(event) {
      const stage = document.getElementById('garden-stage');
      if (!stage) return;
      const rect = stage.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - rect.top) / rect.height) * 100;

      // Keep flowers in the lower 60% (the "grass") for a natural look
      const clampedY = Math.max(35, Math.min(95, y));

      const emojis = ['🌸', '🌺', '🌷', '🌻', '🌹', '🌼', '🪷', '💐'];
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      const size = 24 + Math.floor(Math.random() * 18); // 24-42px

      const flower = { x, y: clampedY, emoji, size };
      gardenFlowers.push(flower);

      // Append directly without re-rendering the whole modal (preserves animation)
      const span = document.createElement('span');
      span.className = 'garden-flower';
      span.style.left = `${x}%`;
      span.style.top = `${clampedY}%`;
      span.style.fontSize = `${size}px`;
      span.textContent = emoji;
      stage.appendChild(span);

      const counter = document.getElementById('garden-count');
      if (counter) counter.textContent = `${gardenFlowers.length} planted`;
    }

    function resetGarden() {
      gardenFlowers = [];
      openGarden();
    }

      const topicEl = document.getElementById('hw-topic');

        return;
      }

      homeworkPosts.unshift({
        id: 'hw' + (uid++),
        topic: topic,
        details: details,
        authorName: currentUser.first + (currentUser.last ? ' ' + currentUser.last + '.' : ''),
        authorRole: currentUser.role,
        timestamp: Date.now(),
        replies: []
      });
      closeModal();
      render();
    }

    function setModal(html) { document.getElementById('modal-body').innerHTML = html; document.getElementById('overlay').classList.add('open'); }
    function closeModal() {
      stopBreathingAnim();
      document.getElementById('overlay').classList.remove('open');
    }

    // ========== UTILITIES ==========
    function escapeHTML(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTime(ts) {
      const diff = Date.now() - ts;
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.floor(hrs / 24);
      if (days < 7) return days + 'd ago';
      return new Date(ts).toLocaleDateString();
    }
  </script>
